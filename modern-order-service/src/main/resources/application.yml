server:
  port: 8082

spring:
  application:
    name: modern-order-service
  datasource:
    url: jdbc:h2:mem:ordersdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  sqs:
    endpoint: http://localhost:4566
    region: us-east-1
    queue-name: order-created-queue
    inventory-result-queue-name: inventory-result-queue
    auto-create-queue: true
    result-listener-enabled: true
    result-poll-interval-ms: 2000
  outbox:
    publisher-enabled: true
    poll-interval-ms: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"
