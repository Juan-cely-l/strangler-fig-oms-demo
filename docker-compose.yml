services:
  localstack:
    image: localstack/localstack:3
    container_name: oms-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      LS_LOG: warn
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - oms-net

  legacy-oms-service:
    image: strangler-fig-oms-demo/legacy-oms-service:local
    build:
      context: .
      dockerfile: legacy-oms-service/Dockerfile
    environment:
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks:
      - oms-net

  modern-order-service:
    image: strangler-fig-oms-demo/modern-order-service:local
    build:
      context: .
      dockerfile: modern-order-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      APP_SQS_ENDPOINT: http://localstack:4566
      APP_SQS_REGION: us-east-1
      APP_SQS_QUEUE_NAME: order-created-queue
      APP_SQS_INVENTORY_RESULT_QUEUE_NAME: inventory-result-queue
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8082:8082"
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks:
      - oms-net

  inventory-service:
    image: strangler-fig-oms-demo/inventory-service:local
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      SERVER_PORT: 8083
      APP_SQS_ENDPOINT: http://localstack:4566
      APP_SQS_REGION: us-east-1
      APP_SQS_QUEUE_NAME: order-created-queue
      APP_SQS_RESULT_QUEUE_NAME: inventory-result-queue
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8083:8083"
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks:
      - oms-net

  strangler-gateway:
    image: strangler-fig-oms-demo/strangler-gateway:local
    build:
      context: .
      dockerfile: strangler-gateway/Dockerfile
    environment:
      SERVER_PORT: 8080
      APP_BACKENDS_LEGACY_URL: http://legacy-oms-service:8081
      APP_BACKENDS_MODERN_ORDER_URL: http://modern-order-service:8082
      APP_BACKENDS_INVENTORY_URL: http://inventory-service:8083
    ports:
      - "8080:8080"
    depends_on:
      legacy-oms-service:
        condition: service_healthy
      modern-order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks:
      - oms-net

  frontend:
    image: strangler-fig-oms-demo/frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      strangler-gateway:
        condition: service_healthy
    networks:
      - oms-net

volumes:
  localstack-data:

networks:
  oms-net:
    driver: bridge
